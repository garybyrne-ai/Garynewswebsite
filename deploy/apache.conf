# ME News Ireland — Apache virtual host. Replace the domain and project path.
# DocumentRoot MUST be the public/ directory; .env, src/, storage/ stay outside it.
<VirtualHost *:80>
    ServerName menews.ie
    DocumentRoot /var/www/menews/public
    <Directory /var/www/menews/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/menews-error.log
    CustomLog ${APACHE_LOG_DIR}/menews-access.log combined
</VirtualHost>
