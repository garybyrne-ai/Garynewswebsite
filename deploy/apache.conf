# Bharat Wire India — Apache virtual host. Replace the domain and project path.
# DocumentRoot MUST be the public/ directory; .env, src/, storage/ stay outside it.
<VirtualHost *:80>
    ServerName bharatwire.in
    DocumentRoot /var/www/bharatwire/public
    <Directory /var/www/bharatwire/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/menews-error.log
    CustomLog ${APACHE_LOG_DIR}/menews-access.log combined
</VirtualHost>
